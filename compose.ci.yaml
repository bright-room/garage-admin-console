services:
  garage:
    image: dxflrs/garage:v2.2.0
    ports:
      - "3900:3900"
      - "3903:3903"
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage-init:
    image: alpine:latest
    depends_on:
      garage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl jq bash && sh /scripts/init-garage.sh"]
    volumes:
      - ./docker/init-garage.sh:/scripts/init-garage.sh:ro

  admin-console:
    build: .
    ports:
      - "8080:8080"
    environment:
      GARAGE_ADMIN_ENDPOINT: http://garage:3903
      GARAGE_ADMIN_TOKEN: dev-admin-token
      GARAGE_S3_ENDPOINT: http://garage:3900
      GARAGE_S3_ACCESS_KEY_ID: ${GARAGE_S3_ACCESS_KEY_ID}
      GARAGE_S3_SECRET_ACCESS_KEY: ${GARAGE_S3_SECRET_ACCESS_KEY}
      GARAGE_S3_REGION: garage
    depends_on:
      garage-init:
        condition: service_completed_successfully
