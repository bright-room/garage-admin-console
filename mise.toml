[tools]
java = "openjdk-25"

[env]
GARAGE_ADMIN_ENDPOINT = "http://localhost:3903"
GARAGE_ADMIN_TOKEN = "dev-admin-token"
GARAGE_S3_ENDPOINT = "http://localhost:3900"
GARAGE_S3_REGION = "garage"

# These values are generated by `docker compose up`.
# Run `docker compose up` first, then copy the keys from the init container logs:
#   docker logs garage-admin-console-garage-init-1
# GARAGE_S3_ACCESS_KEY_ID = ""
# GARAGE_S3_SECRET_ACCESS_KEY = ""
