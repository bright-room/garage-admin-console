ktor:
  deployment:
    host: 0.0.0.0
    port: ${PORT:8080}
  application:
    # プラグインの構成は yaml で列挙する。順序は意味を持つ:
    # StaticFiles の SPA フォールバックは /api の実ルートより後に登録する必要がある。
    modules:
      - net.brightroom.garage.server.plugins.CallLoggingKt.configureCallLogging
      - net.brightroom.garage.server.plugins.SerializationKt.configureSerialization
      - net.brightroom.garage.server.plugins.DiKt.configureDi
      - net.brightroom.garage.server.plugins.StatusPagesKt.configureStatusPages
      - net.brightroom.garage.server.plugins.RoutingKt.configureRouting
      - net.brightroom.garage.server.plugins.StaticFilesKt.configureStaticFiles

garage:
  admin:
    endpoint: ${GARAGE_ADMIN_ENDPOINT:http://localhost:3903}
