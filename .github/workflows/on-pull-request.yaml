name: on-pull-request

on:
  pull_request:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build and Test
        uses: ./.github/actions/gradle-action
        with:
          command: server:check shared:jvmTest

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build Fat JAR
        uses: ./.github/actions/gradle-action
        with:
          command: server:buildFatJar

      - name: Upload Fat JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fat-jar
          path: server/build/libs/garage-admin-console-all.jar
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Start Garage
        run: |
          docker compose -f compose.ci.yaml up -d garage
          docker compose -f compose.ci.yaml up garage-init

      - name: Extract S3 credentials
        id: credentials
        run: |
          ACCESS_KEY_ID=$(docker compose -f compose.ci.yaml logs garage-init | grep "Access Key ID:" | awk '{print $NF}')
          SECRET_ACCESS_KEY=$(docker compose -f compose.ci.yaml logs garage-init | grep "Secret Access Key:" | awk '{print $NF}')
          echo "access_key_id=${ACCESS_KEY_ID}" >> "$GITHUB_OUTPUT"
          echo "::add-mask::${SECRET_ACCESS_KEY}"
          echo "secret_access_key=${SECRET_ACCESS_KEY}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: corretto
          java-version: 21

      - name: Download Fat JAR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fat-jar
          path: server/build/libs

      - name: Start admin console
        env:
          GARAGE_ADMIN_ENDPOINT: http://localhost:3903
          GARAGE_ADMIN_TOKEN: dev-admin-token
          GARAGE_S3_ENDPOINT: http://localhost:3900
          GARAGE_S3_ACCESS_KEY_ID: ${{ steps.credentials.outputs.access_key_id }}
          GARAGE_S3_SECRET_ACCESS_KEY: ${{ steps.credentials.outputs.secret_access_key }}
          GARAGE_S3_REGION: garage
        run: |
          java -jar server/build/libs/garage-admin-console-all.jar &
          timeout 60 bash -c 'until curl -sf http://localhost:8080/ > /dev/null 2>&1; do sleep 2; done'
          echo "Admin console is ready."

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose -f compose.ci.yaml down -v
