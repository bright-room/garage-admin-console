name: on-pull-request

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check and Build
        uses: ./.github/actions/gradle-action
        with:
          command: spotlessCheck server:check shared:check server:buildFatJar

      - name: Upload Fat JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fat-jar
          path: server/build/libs/garage-admin-console-all.jar
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Garage
        run: |
          docker compose -f compose.ci.yaml up -d garage
          docker compose -f compose.ci.yaml up garage-init

      - name: Resolve console admin token
        run: |
          TOKEN=$(docker compose -f compose.ci.yaml logs garage-init \
            | grep 'Console login token:' \
            | sed 's/.*Console login token: //' \
            | tr -d '\r')
          if [ -z "$TOKEN" ]; then
            echo "failed to resolve admin token from garage-init logs" >&2
            docker compose -f compose.ci.yaml logs garage-init >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "E2E_ADMIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Resolve limited-scope token
        run: |
          TOKEN=$(docker compose -f compose.ci.yaml logs garage-init \
            | grep 'Limited-scope token:' \
            | sed 's/.*Limited-scope token: //' \
            | tr -d '\r')
          if [ -z "$TOKEN" ]; then
            echo "failed to resolve limited-scope token from garage-init logs" >&2
            docker compose -f compose.ci.yaml logs garage-init >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "E2E_LIMITED_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Resolve restricted token
        run: |
          TOKEN=$(docker compose -f compose.ci.yaml logs garage-init \
            | grep 'Restricted token:' \
            | sed 's/.*Restricted token: //' \
            | tr -d '\r')
          if [ -z "$TOKEN" ]; then
            echo "failed to resolve restricted token from garage-init logs" >&2
            docker compose -f compose.ci.yaml logs garage-init >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "E2E_RESTRICTED_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: corretto
          java-version: 21

      - name: Download Fat JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fat-jar
          path: server/build/libs

      - name: Start admin console
        env:
          # サーバーは admin token も S3 資格情報も保持しない。
          # トークンは利用者がブラウザで入力し、リクエストごとに転送される。
          # S3 の資格情報は admin token から導出する（spec §6.4）。
          GARAGE_ADMIN_ENDPOINT: http://localhost:3903
          GARAGE_S3_ENDPOINT: http://localhost:3900
          GARAGE_S3_REGION: garage
          GARAGE_S3_PATH_STYLE: "true"
        run: |
          java -jar server/build/libs/garage-admin-console-all.jar &
          timeout 60 bash -c 'until curl -sf http://localhost:8080/ > /dev/null 2>&1; do sleep 2; done'
          echo "Admin console is ready."

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium

      - name: Run E2E tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose -f compose.ci.yaml down -v
