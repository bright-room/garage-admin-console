name: on-pull-request

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and Test
        uses: ./.github/actions/gradle-action
        with:
          command: server:check shared:jvmTest

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Fat JAR
        uses: ./.github/actions/gradle-action
        with:
          command: server:buildFatJar

      - name: Upload Fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: fat-jar
          path: server/build/libs/garage-admin-console-all.jar
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start Garage
        run: |
          docker compose -f compose.ci.yaml up -d garage
          docker compose -f compose.ci.yaml up garage-init

      - name: Extract S3 credentials
        id: credentials
        run: |
          ACCESS_KEY_ID=$(docker compose -f compose.ci.yaml logs garage-init | grep "Access Key ID:" | awk '{print $NF}')
          SECRET_ACCESS_KEY=$(docker compose -f compose.ci.yaml logs garage-init | grep "Secret Access Key:" | awk '{print $NF}')
          echo "access_key_id=${ACCESS_KEY_ID}" >> "$GITHUB_OUTPUT"
          echo "::add-mask::${SECRET_ACCESS_KEY}"
          echo "secret_access_key=${SECRET_ACCESS_KEY}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21

      - name: Download Fat JAR
        uses: actions/download-artifact@v4
        with:
          name: fat-jar
          path: server/build/libs

      - name: Start admin console
        env:
          GARAGE_ADMIN_ENDPOINT: http://localhost:3903
          GARAGE_ADMIN_TOKEN: dev-admin-token
          GARAGE_S3_ENDPOINT: http://localhost:3900
          GARAGE_S3_ACCESS_KEY_ID: ${{ steps.credentials.outputs.access_key_id }}
          GARAGE_S3_SECRET_ACCESS_KEY: ${{ steps.credentials.outputs.secret_access_key }}
          GARAGE_S3_REGION: garage
        run: |
          java -jar server/build/libs/garage-admin-console-all.jar &
          timeout 60 bash -c 'until curl -sf http://localhost:8080/ > /dev/null 2>&1; do sleep 2; done'
          echo "Admin console is ready."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose -f compose.ci.yaml down -v
