name: Seed Cache

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  seed-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and Test
        uses: ./.github/actions/gradle-action
        with:
          command: server:check shared:jvmTest
