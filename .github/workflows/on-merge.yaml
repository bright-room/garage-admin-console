# 役割は 2 つある。
#  1. マージ後の main を検証する（他に main をビルドするワークフローは無い）
#  2. Gradle キャッシュを書く。PR ジョブは cache-read-only で、GitHub の
#     キャッシュはデフォルトブランチのものしか横断参照できないため、
#     このワークフローが無いと全 PR が常にコールドで走る。
# コマンドは on-pull-request と揃える。揃えないと PR 側が温まらない。
name: on-merge

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check and Build
        uses: ./.github/actions/gradle-action
        with:
          command: spotlessCheck server:check shared:jvmTest server:buildFatJar
