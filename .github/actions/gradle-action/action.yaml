name: Gradle Action
description: Sets up Java and Gradle, then runs a Gradle command

inputs:
  command:
    description: Gradle command to execute
    required: true

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        distribution: corretto
        java-version: 21

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

    - name: Run Gradle command
      shell: bash
      env:
        GRADLE_COMMAND: ${{ inputs.command }}
      run: |
        chmod +x ./gradlew
        # 複数タスクを空白区切りで受け取るため意図的にクォートしない
        # shellcheck disable=SC2086
        ./gradlew $GRADLE_COMMAND
